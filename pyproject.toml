[project]
name = "casv"
version = "0.2.0"
description = "Conflict-Aware Semantic Verification for image-to-audio generation"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["legacy", "notebooks", "app.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
