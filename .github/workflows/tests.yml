# Lint and test suite on every push and pull request (no model downloads, about a minute).
name: tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # the version requirements.txt was pinned with
          cache: pip
      - name: Install (CPU-only PyTorch, then the pinned requirements)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Lint
        run: ruff check casv scripts tests app.py app_gradio.py board.py
      - name: Tests
        # On failure, the end of the output also becomes an error annotation, readable on the PR without opening logs
        run: |
          set +e
          pytest -rfE 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=pytest exit code $status::$(tail -n 60 pytest.log | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
          fi
          exit "$status"
